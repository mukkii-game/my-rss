name: Update RSS and publish

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sites/**'
      - 'generate.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rss-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Generate feeds (keep previous feeds on individual failure)
        id: generate
        continue-on-error: true
        run: python generate.py
      - name: Save feed history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m 'Update RSS feeds [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report extraction failures after publishing healthy feeds
        if: steps.generate.outcome == 'failure'
        run: |
          echo 'One or more feeds failed. Check Generate feeds logs and the public status page.'
          exit 1
